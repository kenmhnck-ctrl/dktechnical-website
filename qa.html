<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORDNIX QA</title><style>body{margin:0;background:#050b13;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:900px;margin:auto;padding:28px 18px}.card{background:#0b1523;border:1px solid #5a4720;border-radius:16px;padding:18px}.gold{color:#ffe18b}.row{padding:12px;border-bottom:1px solid #243243}.ok{color:#6ee7a8}.ng{color:#ff8b8b}.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:900;background:linear-gradient(135deg,#ffe89a,#cb901b);color:#171007}pre{white-space:pre-wrap;color:#aeb9c8}</style></head><body><div class="w"><h1>ORDNIX <span class="gold">LIVE QA</span></h1><p>公開環境で主要機能を一周テストします。</p><div class="card"><button class="btn" onclick="run()">全機能テストを実行</button><div id="out"></div></div></div><script>const tests=[['diagnose','/api/diagnose',{company:'株式会社DKテクニカル',industry:'建設・設備',region:'全国',service:'空調工事',channel:'ホームページ',problem:'問い合わせが少ない'}],['plan','/api/plan',{industry:'建設・設備',goal:'問い合わせ増加'}],['autopilot','/api/autopilot',{company:'株式会社DKテクニカル',industry:'建設・設備',region:'全国',service:'空調工事',goal:'問い合わせ増加'}],['content','/api/content',{company:'株式会社DKテクニカル',industry:'建設・設備',region:'全国',service:'空調工事'}],['followup','/api/followup',{company:'株式会社DKテクニカル',industry:'建設・設備',stage:'new',goal:'問い合わせ増加'}],['crm','/api/crm',{event:'diagnosis',score:65,lead:{company:'テスト顧客',industry:'建設・設備'}}],['approval','/api/approval',{assetId:'qa',action:'approve'}],['scheduler','/api/scheduler',{assetId:'qa',approved:true,channel:'SEO'}],['optimize','/api/optimize',{visits:200,leads:18,meetings:6,contracts:1,spend:10000}],['report','/api/report',{company:'株式会社DKテクニカル',visits:200,leads:18,meetings:6,contracts:1}]];async function post(u,d){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={raw:t}};if(!r.ok)throw new Error(r.status+' '+t);return j}async function run(){const o=document.getElementById('out');o.innerHTML='';let pass=0;for(const [n,u,d] of tests){const div=document.createElement('div');div.className='row';div.textContent=n+' ...';o.appendChild(div);try{const r=await post(u,d);pass++;div.innerHTML='<b class="ok">PASS</b> '+n+'<pre>'+JSON.stringify(r,null,2).slice(0,900)+'</pre>'}catch(e){div.innerHTML='<b class="ng">FAIL</b> '+n+'<pre>'+e.message+'</pre>'}}const s=document.createElement('div');s.className='row';s.innerHTML='<h2 class="'+(pass===tests.length?'ok':'ng')+'">'+pass+'/'+tests.length+' PASS</h2>';o.prepend(s)}</script></body></html>
