<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORDNIX QA</title><style>body{margin:0;background:#050b13;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:900px;margin:auto;padding:28px 18px}.card{background:#0b1523;border:1px solid #5a4720;border-radius:16px;padding:18px;margin-bottom:14px}.gold{color:#ffe18b}.row{padding:12px;border-bottom:1px solid #243243}.ok{color:#6ee7a8}.ng{color:#ff8b8b}.warn{color:#ffe18b}.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:900;background:linear-gradient(135deg,#ffe89a,#cb901b);color:#171007}pre{white-space:pre-wrap;color:#aeb9c8}</style></head><body><div class="w"><h1>ORDNIX <span class="gold">PRODUCT QA</span></h1><div class="card"><h2>本番準備状況</h2><div id="ready">確認中...</div></div><div class="card"><button class="btn" onclick="run()">全機能テストを実行</button><div id="out"></div></div></div><script>const base={company:'株式会社DKテクニカル',industry:'建設・設備',region:'札幌・函館',service:'空調工事',target:'法人・店舗・施設',goal:'問い合わせ増加'};async function health(){try{let r=await fetch('/api/health'),j=await r.json(),x=j.readiness||{};document.getElementById('ready').innerHTML=Object.entries(x).map(([k,v])=>'<div class="row"><b class="'+(v?'ok':'warn')+'">'+(v?'READY':'PENDING')+'</b> '+k+'</div>').join('')}catch(e){document.getElementById('ready').innerHTML='<b class="ng">HEALTH ERROR</b>'}}health();const tests=[['diagnose','/api/diagnose',{...base,channel:'ホームページ',problem:'問い合わせが少ない'}],['plan','/api/plan',base],['autopilot','/api/autopilot',base],['content','/api/content',base],['followup','/api/followup',{...base,stage:'new'}],['crm','/api/crm',{event:'diagnosis',score:65,lead:{company:'QAテスト顧客',industry:'建設・設備'}}],['crm-list','/api/crm-list',{}],['approval','/api/approval',{assetId:'qa',action:'approve'}],['scheduler','/api/scheduler',{assetId:'qa',approved:true,channel:'SEO'}],['guard-block','/api/guard',{channel:'email',approved:false,connected:false,consent:false}],['optimize','/api/optimize',{visits:200,leads:18,meetings:6,contracts:1}],['report','/api/report',{...base,leads:18,meetings:6,contracts:1}],['ai-diagnose','/api/ai-diagnose',base],['ai-plan','/api/ai-plan',base],['ai-content','/api/ai-content',base]];async function post(u,d){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),t=await r.text();if(!r.ok)throw Error(r.status+' '+t);return JSON.parse(t)}async function run(){const o=document.getElementById('out');o.innerHTML='';let pass=0;for(const [n,u,d] of tests){let div=document.createElement('div');div.className='row';o.appendChild(div);try{let r=await post(u,d);pass++;div.innerHTML='<b class="ok">PASS</b> '+n+'<pre>'+JSON.stringify(r,null,2).slice(0,700)+'</pre>'}catch(e){div.innerHTML='<b class="ng">FAIL</b> '+n+'<pre>'+e.message+'</pre>'}}let s=document.createElement('div');s.className='row';s.innerHTML='<h2 class="'+(pass===tests.length?'ok':'ng')+'">'+pass+'/'+tests.length+' PASS</h2>';o.prepend(s)}</script></body></html>
