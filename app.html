<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORDNIX Control Center</title><style>:root{--g:#e8b84a;--g2:#ffd978;--bg:#050b14;--card:#0b1523;--text:#eef2f7;--muted:#91a0b3}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#03070d,#081522);color:var(--text)}header{padding:20px 24px;border-bottom:1px solid #2b2618;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(5,11,20,.95);z-index:5}.brand{font-size:24px;font-weight:950}.brand span{color:var(--g2)}.wrap{max-width:1200px;margin:auto;padding:28px 20px}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:rgba(11,21,35,.96);border:1px solid rgba(232,184,74,.22);border-radius:16px;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.2)}h1{font-size:30px;margin:0 0 8px}h2{font-size:18px;margin:0 0 14px;color:var(--g2)}p{color:var(--muted);line-height:1.6}label{display:block;font-size:12px;color:#c9d2de;margin:11px 0 5px;font-weight:800}input,select{width:100%;background:#07101c;border:1px solid #263548;border-radius:9px;color:#fff;padding:11px}.btn{width:100%;border:0;border-radius:10px;padding:13px;font-weight:900;margin-top:12px;background:linear-gradient(135deg,#ffe79a,#d79b1f);color:#17110a;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#0d1a2a;border:1px solid #263548;color:#dce5ef;padding:9px 12px;border-radius:9px;cursor:pointer}.tab.active{border-color:var(--g);color:var(--g2)}.pane{display:none}.pane.active{display:block}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:14px;border-radius:12px;background:#07101c;border:1px solid #1d2b3b}.metric b{display:block;font-size:26px;color:var(--g2);margin-top:5px}.list{display:grid;gap:10px}.item{padding:14px;border-radius:12px;background:#07101c;border:1px solid #1d2b3b}.item strong{color:#fff}.tag{display:inline-block;font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:#283446;color:#ffdd79;margin-left:6px}.result{white-space:pre-wrap;background:#07101c;border:1px solid #25364a;border-radius:12px;padding:14px;color:#dce5ef;min-height:120px;overflow:auto}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ok{color:#61d99d}.footer{padding:30px;text-align:center;color:#64748b;font-size:12px}@media(max-width:820px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}</style></head><body><header><div class="brand"><span>◉</span> ORDNIX</div><div style="color:#ffdc72;font-weight:900">CONTROL CENTER</div></header><div class="wrap"><h1>AI集客オペレーション</h1><p>会社情報を設定すると、診断・90日戦略・今日のタスク・コンテンツ・追客・改善レポートを一つの流れで生成します。</p><div class="grid"><aside class="card"><h2>会社設定</h2><label>会社名</label><input id="company" value="株式会社DKテクニカル"><label>業種</label><select id="industry"><option>建設・設備</option><option>美容・サロン</option><option>不動産</option><option>士業・コンサル</option><option>自動車・整備</option><option>飲食・店舗</option><option>医療・クリニック</option><option>その他</option></select><label>地域</label><input id="region" value="全国"><label>サービス</label><input id="service" value="空調工事・設備工事"><label>ターゲット</label><input id="target" value="法人・店舗・施設"><label>目標</label><input id="goal" value="問い合わせ増加"><button class="btn" onclick="initialize()">ORDNIXを起動</button><p id="state">未実行</p></aside><main class="card"><div class="tabs"><button class="tab active" data-p="overview">概要</button><button class="tab" data-p="plan">90日戦略</button><button class="tab" data-p="tasks">今日の仕事</button><button class="tab" data-p="content">コンテンツ</button><button class="tab" data-p="followup">追客</button><button class="tab" data-p="report">改善</button></div><section class="pane active" id="overview"><div class="metrics"><div class="metric">集客スコア<b id="score">--</b></div><div class="metric">今週タスク<b id="taskCount">0</b></div><div class="metric">コンテンツ<b id="assetCount">0</b></div><div class="metric">状態<b style="font-size:17px" id="mode">STANDBY</b></div></div><div class="result" id="summary" style="margin-top:12px">ORDNIXを起動してください。</div></section><section class="pane" id="plan"><div class="result" id="planOut">未生成</div></section><section class="pane" id="tasks"><div class="list" id="tasksOut"></div></section><section class="pane" id="content"><div class="split"><div><h2>生成コンテンツ</h2><div class="result" id="contentOut">未生成</div></div><div><h2>承認</h2><p>外部公開前に人が確認する安全設計です。</p><button class="btn" onclick="approve()">この内容を承認</button><div class="result" id="approvalOut">承認待ち</div></div></div></section><section class="pane" id="followup"><div class="result" id="followOut">未生成</div></section><section class="pane" id="report"><div class="split"><div><h2>今週の数字</h2><label>訪問</label><input id="visits" type="number" value="200"><label>リード</label><input id="leads" type="number" value="18"><label>商談</label><input id="meetings" type="number" value="6"><label>契約</label><input id="contracts" type="number" value="1"><button class="btn" onclick="optimize()">改善判断を実行</button></div><div><h2>AI改善判断</h2><div class="result" id="reportOut">未実行</div></div></div></section></main></div></div><div class="footer">ORDNIX MVP — 外部投稿・送信は正規接続後に承認済み内容のみ実行</div><script>document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.p).classList.add('active')});const val=id=>document.getElementById(id).value;async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error(await r.text());return r.json()}function profile(){return{company:val('company'),industry:val('industry'),region:val('region'),service:val('service'),target:val('target'),goal:val('goal')}}async function initialize(){document.getElementById('state').textContent='実行中...';try{const p=profile();const [d,plan,a,c,f]=await Promise.all([post('/api/diagnose',{...p,channel:'ホームページ',problem:'問い合わせが少ない'}),post('/api/plan',p),post('/api/autopilot',p),post('/api/content',p),post('/api/followup',{company:p.company,industry:p.industry,stage:'new',interest:p.goal})]);score.textContent=d.score;summary.textContent=d.summary+'\n\n優先施策：'+d.actions.join(' / ');planOut.textContent=JSON.stringify(plan,null,2);taskCount.textContent=a.today.length;tasksOut.innerHTML=a.today.map(x=>`<div class="item"><strong>${x.title}</strong><span class="tag">${x.status}</span><p>${x.type} / ${x.channel}</p></div>`).join('');assetCount.textContent=(c.assets.social||[]).length+2;contentOut.textContent=JSON.stringify(c.assets,null,2);followOut.textContent=f.sequence.map(x=>`Day ${x.day}｜${x.subject}\n${x.body}`).join('\n\n');mode.textContent='AUTOPILOT';state.innerHTML='<span class="ok">起動済み</span>'; }catch(e){state.textContent='エラー：'+e.message}}async function approve(){try{const r=await post('/api/approval',{assetId:'current-content',action:'approve'});approvalOut.textContent=JSON.stringify(r,null,2)}catch(e){approvalOut.textContent=e.message}}async function optimize(){try{const data={visits:+val('visits'),leads:+val('leads'),meetings:+val('meetings'),contracts:+val('contracts'),spend:0};const r=await post('/api/optimize',data);reportOut.textContent=`優先：${r.priority}\n\n次の施策：${r.action}\n\n問い合わせ率 ${r.metrics.leadRate}% / 商談化率 ${r.metrics.meetingRate}% / 成約率 ${r.metrics.closeRate}%` }catch(e){reportOut.textContent=e.message}}</script></body></html>
