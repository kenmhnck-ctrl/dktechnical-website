<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORDNIX Control Center</title><style>:root{--gold:#ffe18b;--bg:#050b13;--card:#0b1523;--mut:#9aa9ba;--ok:#6ee7a8;--warn:#ffc96a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#182232,#050b13 42%);color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}header{padding:18px 5vw;border-bottom:1px solid #5a4720;display:flex;justify-content:space-between;position:sticky;top:0;background:#050b13ee;z-index:5}.brand{font-size:23px;font-weight:950}.gold,h2{color:var(--gold)}.ok{color:var(--ok)}.warn{color:var(--warn)}.wrap{max-width:1240px;margin:auto;padding:28px 18px 70px}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.card{background:linear-gradient(145deg,#0d1827,#07101b);border:1px solid #39311f;border-radius:16px;padding:17px}label{display:block;font-size:11px;font-weight:800;margin:9px 0 5px;color:#ccd5df}input,select{width:100%;padding:11px;border:1px solid #304052;border-radius:9px;background:#06101b;color:white}.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:9px;font-weight:900;background:linear-gradient(135deg,#ffe89a,#cb901b);color:#171007}.btn2{background:#111e2d;color:#ffe18b;border:1px solid #5e4b22}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.metric,.result{background:#050b13;border:1px solid #263647;border-radius:11px;padding:13px}.metric small{color:var(--mut)}.metric b{display:block;color:var(--gold);font-size:21px;margin-top:5px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.tab{padding:8px 11px;border:1px solid #304052;border-radius:999px;background:#0a1522;color:#e5edf6}.tab.active{background:var(--gold);color:#171007}.pane{display:none}.pane.active{display:block}.cols{display:grid;grid-template-columns:1fr 1fr;gap:11px}.result{white-space:pre-wrap;min-height:120px;line-height:1.55}.ai{border-color:#80621e}.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.stage{text-align:center;background:#07101b;border:1px solid #263647;border-radius:9px;padding:10px}.stage b{display:block;color:var(--gold);font-size:20px}.lead{padding:11px;border-bottom:1px solid #253343}.lead:last-child{border:0}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#172436;color:#ffe18b;font-size:10px;font-weight:800}.health{font-size:12px;line-height:1.8}@media(max-width:900px){.grid,.cols{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.pipeline{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="brand"><span class="gold">◉</span> ORDNIX</div><b class="ok">PRODUCT CONTROL</b></header><div class="wrap"><h1>AI集客オペレーション</h1><div class="grid"><aside><div class="card"><h2>会社設定</h2><label>会社名</label><input id="company" value="株式会社DKテクニカル"><label>業種</label><select id="industry"><option>建設・設備</option><option>美容・サロン</option><option>不動産</option><option>士業・コンサル</option><option>医療・クリニック</option><option>自動車・整備</option><option>飲食・店舗</option><option>その他</option></select><label>地域</label><input id="region" value="札幌・函館"><label>サービス</label><input id="service" value="空調工事・設備工事"><label>ターゲット</label><input id="target" value="法人・店舗・施設"><label>目標</label><input id="goal" value="問い合わせ増加"><button class="btn" onclick="boot()">ORDNIXを起動</button><button class="btn btn2" onclick="refreshAll()">データ再読込</button><p id="state">STANDBY</p></div><div class="card" style="margin-top:12px"><h2>本番準備</h2><div id="readiness" class="health">確認中...</div></div></aside><main><div class="metrics"><div class="metric"><small>集客スコア</small><b id="score">--</b></div><div class="metric"><small>グレード</small><b id="grade">--</b></div><div class="metric"><small>今日の仕事</small><b id="tasks">0</b></div><div class="metric"><small>リード</small><b id="leads">0</b></div><div class="metric"><small>AI</small><b id="aimode" style="font-size:13px">READY</b></div><div class="metric"><small>DB</small><b id="dbmode" style="font-size:13px">CHECK</b></div></div><div class="tabs"><button class="tab active" data-p="overview">概要</button><button class="tab" data-p="strategy">AI戦略</button><button class="tab" data-p="content">AIコンテンツ</button><button class="tab" data-p="crm">CRM</button><button class="tab" data-p="delivery">承認・配信</button><button class="tab" data-p="opt">改善</button></div><section id="overview" class="pane active"><div class="cols"><div class="card"><h2>診断</h2><div id="diag" class="result"></div></div><div class="card ai"><h2>生成AI分析</h2><div id="aidiag" class="result">未生成</div></div></div></section><section id="strategy" class="pane"><div class="cols"><div class="card"><h2>90日計画</h2><div id="plan" class="result"></div></div><div class="card ai"><h2>AI戦略</h2><div id="aiplan" class="result"></div></div></div></section><section id="content" class="pane"><div class="card ai"><h2>AIコンテンツ</h2><button class="btn" onclick="genContent()">再生成</button><div id="aiContent" class="result" style="margin-top:10px"></div></div></section><section id="crm" class="pane"><div class="card"><h2>CRM</h2><div class="pipeline"><div class="stage">NEW<b id="pnew">0</b></div><div class="stage">ENGAGED<b id="pengaged">0</b></div><div class="stage">MEETING<b id="pmeeting">0</b></div><div class="stage">PROPOSAL<b id="pproposal">0</b></div><div class="stage">WON<b id="pwon">0</b></div><div class="stage">LOST<b id="plost">0</b></div></div><div class="cols" style="margin-top:12px"><div><label>見込み客会社名</label><input id="leadCompany"><label>メール</label><input id="leadEmail" type="email" placeholder="contact@example.com"><label>スコア</label><input id="leadScore" type="number" value="60"><button class="btn" onclick="addLead()">リード登録</button></div><div><h2>最新リード</h2><div id="crmList" class="result">読込中...</div></div></div></div></section><section id="delivery" class="pane"><div class="cols"><div class="card"><h2>承認</h2><button class="btn" onclick="approve()">承認</button><div id="approval" class="result">承認待ち</div></div><div class="card"><h2>配信キュー</h2><button class="btn" onclick="queue()">キューへ登録</button><div id="queue" class="result"></div></div></div></section><section id="opt" class="pane"><div class="card"><h2>改善エンジン</h2><button class="btn" onclick="optimize()">週次改善を実行</button><div id="optOut" class="result"></div></div></section></main></div></div><script>const $=x=>document.getElementById(x),v=x=>$(x).value;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});async function post(u,d){let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw Error(await r.text());return r.json()}function p(){return{company:v('company'),industry:v('industry'),region:v('region'),service:v('service'),target:v('target'),goal:v('goal')}}function f(x){return JSON.stringify(x,null,2)}async function loadReadiness(){try{let r=await post('/api/readiness',{}),items=[['DB',r.database],['AI認証',r.aiAuth],['AIモデル',r.aiModel],['外部連携',r.externalConnectors],['決済',r.payments]];$('dbmode').textContent=r.database?'CONNECTED':'PENDING';$('readiness').innerHTML=items.map(([k,z])=>'<div><span class="'+(z?'ok':'warn')+'">'+(z?'READY':'PENDING')+'</span> '+k+'</div>').join('')}catch(e){$('readiness').textContent='READINESS ERROR'}}async function loadCrm(){try{let r=await post('/api/crm-list',{});$('dbmode').textContent=r.connected?'CONNECTED':'PENDING';let c=r.counts||{};$('pnew').textContent=c.NEW||0;$('pengaged').textContent=c.ENGAGED||0;$('pmeeting').textContent=c.MEETING||0;$('pproposal').textContent=c.PROPOSAL||0;$('pwon').textContent=c.WON||0;$('plost').textContent=c.LOST||0;$('leads').textContent=(r.leads||[]).length;$('crmList').innerHTML=r.connected?(r.leads||[]).slice(0,12).map(x=>'<div class="lead"><b>'+esc(x.company_name)+'</b> <span class="badge">'+esc(String(x.status||'new').toUpperCase())+'</span><br><small>'+esc(x.industry||'')+' / '+esc(x.source||'')+'</small></div>').join('')||'リードなし':'DB未接続'}catch(e){$('crmList').textContent='CRM ERROR'}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function boot(){try{$('state').textContent='起動中';let x=p(),[d,pl,a,ad,ap,ac]=await Promise.all([post('/api/diagnose',{...x,channel:'ホームページ',problem:'問い合わせが少ない'}),post('/api/plan',x),post('/api/autopilot',x),post('/api/ai-diagnose',{...x,channel:'ホームページ',problem:'問い合わせが少ない'}),post('/api/ai-plan',x),post('/api/ai-content',x)]);$('score').textContent=d.score;$('grade').textContent=d.grade;$('tasks').textContent=a.today.length;$('diag').textContent=d.summary+'\n\n・'+d.actions.join('\n・');$('plan').textContent=pl.weeks.map(w=>'Week '+w.week+' '+w.phase+'\n・'+w.tasks.join('\n・')).join('\n\n');$('aidiag').textContent=f(ad);$('aiplan').textContent=f(ap);$('aiContent').textContent=f(ac);$('aimode').textContent=ad.ai?.enabled?'GENERATIVE':'SAFE FALLBACK';$('state').innerHTML='<span class="ok">起動済み</span>';localStorage.setItem('ordnix_profile',JSON.stringify(x));await refreshAll()}catch(e){$('state').textContent='ERROR '+e.message}}async function genContent(){let r=await post('/api/ai-content',p());$('aiContent').textContent=f(r);$('aimode').textContent=r.ai?.enabled?'GENERATIVE':'SAFE FALLBACK'}async function addLead(){try{let r=await post('/api/crm',{event:'diagnosis',score:+v('leadScore')||60,lead:{company:v('leadCompany')||'見込み客',email:v('leadEmail'),industry:v('industry')}});await loadCrm();$('crmList').insertAdjacentHTML('afterbegin','<div class="lead"><b>登録結果</b><br>'+esc(f(r))+'</div>')}catch(e){$('crmList').textContent=e.message}}let approved=false;async function approve(){let r=await post('/api/approval',{assetId:'ai-content',action:'approve'});approved=r.publishEligibility;$('approval').textContent=f(r)}async function queue(){let r=await post('/api/scheduler',{assetId:'ai-content',approved,channel:'SEO'});$('queue').textContent=f(r)}async function optimize(){let r=await post('/api/optimize',{visits:200,leads:18,meetings:6,contracts:1,spend:10000});$('optOut').textContent=f(r)}async function refreshAll(){await Promise.all([loadReadiness(),loadCrm()])}try{let s=JSON.parse(localStorage.getItem('ordnix_profile'));if(s)Object.keys(s).forEach(k=>$(k)&&($(k).value=s[k]))}catch{}refreshAll();boot()</script></body></html>
