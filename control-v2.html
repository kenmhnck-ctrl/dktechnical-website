<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORDNIX Control Center</title><style>:root{--g:#ffe18b;--m:#9aa9ba;--ok:#6ee7a8;--w:#ffc96a;--danger:#ff8d8d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#182232,#050b13 42%);color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}header{padding:17px 5vw;border-bottom:1px solid #5a4720;display:flex;justify-content:space-between;position:sticky;top:0;background:#050b13f2;z-index:5}.gold,h2{color:var(--g)}.ok{color:var(--ok)}.warn{color:var(--w)}.danger{color:var(--danger)}.wrap{max-width:1240px;margin:auto;padding:26px 18px 70px}.grid{display:grid;grid-template-columns:310px 1fr;gap:16px}.card{background:linear-gradient(145deg,#0d1827,#07101b);border:1px solid #39311f;border-radius:16px;padding:17px}label{display:block;font-size:11px;font-weight:800;margin:9px 0 5px;color:#ccd5df}input,select{width:100%;padding:11px;border:1px solid #304052;border-radius:9px;background:#06101b;color:white}.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:9px;font-weight:900;background:linear-gradient(135deg,#ffe89a,#cb901b);color:#171007}.btn2{background:#111e2d;color:#ffe18b;border:1px solid #5e4b22}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.metric,.result{background:#050b13;border:1px solid #263647;border-radius:11px;padding:13px}.metric small{color:var(--m)}.metric b{display:block;color:var(--g);font-size:20px;margin-top:5px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.tab{padding:8px 11px;border:1px solid #304052;border-radius:999px;background:#0a1522;color:#e5edf6}.tab.active{background:var(--g);color:#171007}.pane{display:none}.pane.active{display:block}.cols{display:grid;grid-template-columns:1fr 1fr;gap:11px}.result{white-space:pre-wrap;min-height:100px;line-height:1.55}.ai{border-color:#80621e}.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.stage{text-align:center;background:#07101b;border:1px solid #263647;border-radius:9px;padding:10px}.stage b{display:block;color:var(--g);font-size:20px}.lead{padding:10px;border-bottom:1px solid #253343}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#172436;color:#ffe18b;font-size:10px;font-weight:800}.health{font-size:12px;line-height:1.8}.locked{opacity:.48;pointer-events:none;filter:saturate(.5)}@media(max-width:900px){.grid,.cols{grid-template-columns:1fr}.metrics,.pipeline{grid-template-columns:1fr 1fr}}</style></head><body><header><b><span class="gold">◉</span> ORDNIX</b><b id="authBadge" class="warn">LOCKED</b></header><div class="wrap"><h1>AI集客オペレーション</h1><div class="grid"><aside><div class="card"><h2>安全なアクセス</h2><label>ワークスペースキー</label><input id="apiKey" type="password" autocomplete="current-password" placeholder="アクセスキーを入力"><button class="btn" onclick="unlock()">Control Centerを開く</button><button class="btn btn2" onclick="lock()">ロック</button><p id="authState" class="warn">認証が必要です</p></div><div class="card" style="margin-top:12px"><h2>ワークスペース</h2><label>顧客ID</label><input id="tenant" value="dk-technical" disabled><label>会社名</label><input id="company" value="株式会社DKテクニカル"><label>業種</label><select id="industry"><option>建設・設備</option><option>美容・サロン</option><option>不動産</option><option>士業・コンサル</option><option>医療・クリニック</option><option>自動車・整備</option><option>飲食・店舗</option><option>その他</option></select><label>地域</label><input id="region" value="札幌・函館"><label>サービス</label><input id="service" value="空調工事・設備工事"><label>ターゲット</label><input id="target" value="法人・店舗・施設"><label>目標</label><input id="goal" value="問い合わせ増加"><button class="btn" onclick="boot()">ORDNIXを起動</button><button class="btn btn2" onclick="refreshAll()">データ再読込</button><p id="state">STANDBY</p></div><div class="card" style="margin-top:12px"><h2>本番準備</h2><div id="readiness" class="health">ロック中</div></div></aside><main id="privateArea" class="locked"><div class="metrics"><div class="metric"><small>集客スコア</small><b id="score">--</b></div><div class="metric"><small>グレード</small><b id="grade">--</b></div><div class="metric"><small>今日の仕事</small><b id="tasks">0</b></div><div class="metric"><small>リード</small><b id="leads">0</b></div><div class="metric"><small>AI</small><b id="aimode" style="font-size:12px">LOCKED</b></div><div class="metric"><small>DB</small><b id="dbmode" style="font-size:12px">LOCKED</b></div></div><div class="tabs"><button class="tab active" data-p="overview">概要</button><button class="tab" data-p="strategy">AI戦略</button><button class="tab" data-p="content">AIコンテンツ</button><button class="tab" data-p="crm">CRM</button><button class="tab" data-p="delivery">承認・配信</button><button class="tab" data-p="opt">改善</button></div><section id="overview" class="pane active"><div class="cols"><div class="card"><h2>診断</h2><div id="diag" class="result"></div></div><div class="card ai"><h2>生成AI分析</h2><div id="aidiag" class="result"></div></div></div></section><section id="strategy" class="pane"><div class="cols"><div class="card"><h2>90日計画</h2><div id="plan" class="result"></div></div><div class="card ai"><h2>AI戦略</h2><div id="aiplan" class="result"></div></div></div></section><section id="content" class="pane"><div class="card ai"><h2>AIコンテンツ</h2><button class="btn" onclick="genContent()">再生成</button><div id="aiContent" class="result"></div></div></section><section id="crm" class="pane"><div class="card"><h2>CRM</h2><div class="pipeline"><div class="stage">NEW<b id="pnew">0</b></div><div class="stage">ENGAGED<b id="pengaged">0</b></div><div class="stage">MEETING<b id="pmeeting">0</b></div><div class="stage">PROPOSAL<b id="pproposal">0</b></div><div class="stage">WON<b id="pwon">0</b></div><div class="stage">LOST<b id="plost">0</b></div></div><div class="cols"><div><label>見込み客会社名</label><input id="leadCompany"><label>メール</label><input id="leadEmail" type="email"><label>スコア</label><input id="leadScore" type="number" value="60"><button class="btn" onclick="addLead()">リード登録</button></div><div><h2>最新リード</h2><div id="crmList" class="result"></div></div></div></div></section><section id="delivery" class="pane"><div class="cols"><div class="card"><h2>承認</h2><button class="btn" onclick="approve()">承認</button><div id="approval" class="result">承認待ち</div></div><div class="card"><h2>配信キュー</h2><button class="btn" onclick="queue()">キューへ登録</button><div id="queue" class="result"></div></div></div></section><section id="opt" class="pane"><div class="card"><h2>改善エンジン</h2><button class="btn" onclick="optimize()">週次改善を実行</button><div id="optOut" class="result"></div></div></section></main></div></div><script>const $=x=>document.getElementById(x),v=x=>$(x).value;let token='';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});async function post(u,d){if(!token)throw Error('AUTH_REQUIRED');let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(d)});let t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return JSON.parse(t)}function p(){return{tenant:v('tenant'),company:v('company'),industry:v('industry'),region:v('region'),service:v('service'),target:v('target'),goal:v('goal')}}function f(x){return JSON.stringify(x,null,2)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function unlock(){token=v('apiKey').trim();if(!token)return;try{let r=await post('/api/readiness',p());$('privateArea').classList.remove('locked');$('authBadge').className='ok';$('authBadge').textContent='AUTHENTICATED';$('authState').className='ok';$('authState').textContent='認証済み';sessionStorage.setItem('ordnix_key',token);await refreshAll();await boot()}catch(e){token='';sessionStorage.removeItem('ordnix_key');$('authState').className='danger';$('authState').textContent='認証できません'}}function lock(){token='';sessionStorage.removeItem('ordnix_key');$('apiKey').value='';$('privateArea').classList.add('locked');$('authBadge').className='warn';$('authBadge').textContent='LOCKED';$('authState').className='warn';$('authState').textContent='認証が必要です'}async function loadReadiness(){let r=await post('/api/readiness',p()),items=[['DB',r.database],['AI認証',r.aiAuth],['AIモデル',r.aiModel],['顧客分離',r.tenantIsolation],['リトライ/フォールバック',r.retryFallback],['外部連携',r.externalConnectors],['決済',r.payments]];$('dbmode').textContent=r.database?'CONNECTED':'PENDING';$('readiness').innerHTML=items.map(([k,z])=>'<div><span class="'+(z?'ok':'warn')+'">'+(z?'READY':'PENDING')+'</span> '+k+'</div>').join('')}async function loadCrm(){let r=await post('/api/crm-list',p());$('dbmode').textContent=r.connected?'CONNECTED':'PENDING';let c=r.counts||{};for(let s of ['new','engaged','meeting','proposal','won','lost'])$('p'+s).textContent=c[s.toUpperCase()]||0;$('leads').textContent=(r.leads||[]).length;$('crmList').innerHTML=r.connected?(r.leads||[]).slice(0,12).map(x=>'<div class="lead"><b>'+esc(x.company_name)+'</b> <span class="badge">'+esc(String(x.status||'new').toUpperCase())+'</span><br><small>'+esc(x.industry||'')+' / '+esc(x.source||'')+'</small></div>').join('')||'リードなし':'DB未接続'}async function boot(){try{$('state').textContent='起動中';let x=p(),[d,pl,a,ad,ap,ac]=await Promise.all([fetch('/api/diagnose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...x,channel:'ホームページ',problem:'問い合わせが少ない'})}).then(r=>r.json()),post('/api/plan',x),post('/api/autopilot',x),post('/api/ai-diagnose',x),post('/api/ai-plan',x),post('/api/ai-content',x)]);$('score').textContent=d.score;$('grade').textContent=d.grade;$('tasks').textContent=a.today.length;$('diag').textContent=d.summary+'\n\n・'+d.actions.join('\n・');$('plan').textContent=pl.weeks.map(w=>'Week '+w.week+' '+w.phase+'\n・'+w.tasks.join('\n・')).join('\n\n');$('aidiag').textContent=f(ad);$('aiplan').textContent=f(ap);$('aiContent').textContent=f(ac);$('aimode').textContent=ad.ai?.enabled?'GENERATIVE':'SAFE FALLBACK';$('state').innerHTML='<span class="ok">起動済み</span>'}catch(e){$('state').textContent='ERROR'}}async function genContent(){$('aiContent').textContent=f(await post('/api/ai-content',p()))}async function addLead(){await post('/api/crm',{...p(),event:'diagnosis',score:+v('leadScore')||60,lead:{company:v('leadCompany')||'見込み客',email:v('leadEmail'),industry:v('industry')}});await loadCrm()}let approved=false;async function approve(){let r=await post('/api/approval',{...p(),assetId:'ai-content',action:'approve'});approved=r.publishEligibility;$('approval').textContent=f(r)}async function queue(){$('queue').textContent=f(await post('/api/scheduler',{...p(),assetId:'ai-content',approved,channel:'SEO'}))}async function optimize(){$('optOut').textContent=f(await post('/api/optimize',{...p(),visits:200,leads:18,meetings:6,contracts:1}))}async function refreshAll(){await Promise.all([loadReadiness(),loadCrm()])}const saved=sessionStorage.getItem('ordnix_key');if(saved){$('apiKey').value=saved;token=saved;unlock()}</script></body></html>
